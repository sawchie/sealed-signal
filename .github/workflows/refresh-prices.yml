name: Daily market prices
on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
    inputs:
      exchange_only:
        description: 'Refresh only currency exchange rates'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: daily-market-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh currency exchange rates
        run: node scripts/daily-exchange-refresh.mjs
      - name: Refresh exact-product market quotes
        if: ${{ !cancelled() && inputs.exchange_only != true }}
        run: node scripts/daily-price-refresh.mjs
