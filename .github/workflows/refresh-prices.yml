name: Daily market prices
on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: daily-market-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh exact-product market quotes
        run: node scripts/daily-price-refresh.mjs
